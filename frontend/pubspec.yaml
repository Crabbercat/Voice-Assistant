
name: viethome_frontend
description: "VietHome-AI Flutter web and mobile interface."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Giao diện và mạng
  cupertino_icons: ^1.0.6
  http: ^1.6.0

  shared_preferences: ^2.5.6

  material_ui: any
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/smart_home_icon.png
    - assets/images/smart_home_house.jpg

# Tạo icon ứng dụng Android và iOS
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/smart_home_icon.png"
  min_sdk_android: 21
